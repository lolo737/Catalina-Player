# Builds a universal Catalina Player.app (Intel for macOS 10.15+, Apple silicon for 11+).
# Run it from the Actions tab ("Build app" → Run workflow), or push a tag like v1.0.0
# to attach the zip to a GitHub Release.
name: Build app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile (Intel + Apple silicon)
        run: |
          mkdir -p out
          swiftc -O -target x86_64-apple-macos10.15 Sources/*.swift -o out/CatalinaPlayer-x86_64
          swiftc -O -target arm64-apple-macos11.0 Sources/*.swift -o out/CatalinaPlayer-arm64
          lipo -create out/CatalinaPlayer-x86_64 out/CatalinaPlayer-arm64 -output out/CatalinaPlayer
      - name: Assemble the app
        run: |
          APP="build/Catalina Player.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" build/AppIcon.iconset
          cp out/CatalinaPlayer "$APP/Contents/MacOS/CatalinaPlayer"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          for s in 16 32 128 256 512; do
            sips -z $s $s Resources/icon-1024.png --out build/AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) Resources/icon-1024.png --out build/AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Catalina-Player.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Catalina-Player
          path: Catalina-Player.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Catalina-Player.zip
